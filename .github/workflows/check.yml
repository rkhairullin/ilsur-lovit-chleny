name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - name: Run browser tests in Playwright container
        run: |
          version="$(node -p 'require("@playwright/test/package.json").version')"
          docker run --rm --init --ipc=host \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/work" --workdir /work \
            --env HOME=/tmp --env CI=true --env PLAYWRIGHT_SKIP_BUILD=1 \
            "mcr.microsoft.com/playwright:v${version}-noble" npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-reports
          path: |
            coverage
            test-results
            playwright-report
